<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVU Alumni Network - Login</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Override default white container for the Neon Space Theme */
        .container {
            background-color: rgba(10, 15, 30, 0.75) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 210, 255, 0.3) !important;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2) !important;
            color: #ffffff;
        }
        
        form input, form select {
            background-color: rgba(0, 0, 0, 0.5) !important;
            color: #ffffff !important;
            border: 1px solid rgba(0, 210, 255, 0.5) !important;
            outline: none;
            transition: box-shadow 0.3s, border-color 0.3s;
        }

        form input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        form input:focus, form select:focus {
            box-shadow: inset 0 0 8px rgba(0, 210, 255, 0.5);
            border-color: #00d2ff !important;
        }

        form button {
            background-color: rgba(0, 210, 255, 0.15) !important;
            color: #00d2ff !important;
            border: 1px solid #00d2ff !important;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
            font-weight: bold;
            transition: all 0.3s ease;
        }

        form button:hover {
            background-color: #00d2ff !important;
            color: #000 !important;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.8);
        }

        a {
            color: #00d2ff !important;
            text-shadow: 0 0 5px rgba(0, 210, 255, 0.5);
            transition: color 0.3s, text-shadow 0.3s;
        }

        a:hover {
            color: #ffffff !important;
            text-shadow: 0 0 10px #ffffff;
        }

        /* Hide the profile role text color override issue */
        select option {
            background-color: #02040a;
            color: white;
        }

        /* Force centering for the login page specifically */
        body.dashboard-body {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            height: 100vh !important;
        }
    </style>
</head>

<!-- Added dashboard-body class to pull in the starry dropping background -->
<body class="dashboard-body">
    <div class="container">
        
        <!-- Branding Header -->
        <div class="brand-header" style="text-align: center; margin-bottom: 25px;">
            <img src="image_d00988.jpg" alt="SVU Logo" style="height: 80px; width: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; box-shadow: 0 0 15px rgba(0, 210, 255, 0.5); border: 2px solid rgba(0, 210, 255, 0.3);">
            <h1 style="margin: 0; font-size: 1.6rem; color: #ffffff; text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);">SVU Alumni Network</h1>
        </div>

        <!-- Register Section -->
        <div id="register-section" class="form-section">
            <h2 style="text-align: center; margin-bottom: 20px; color: #00d2ff; text-shadow: 0 0 8px rgba(0, 210, 255, 0.4);">Register</h2>
            <form id="register-form">
                <select id="reg-role" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="Student">Student</option>
                    <option value="Alumni">Alumni</option>
                </select>
                <input type="text" id="reg-name" placeholder="Full Name" required>
                <input type="email" id="reg-email" placeholder="Email Address" required>
                <input type="text" id="reg-username" placeholder="Unique Username" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <input type="password" id="reg-confirm-password" placeholder="Confirm Password" required>
                <button type="submit">Sign Up</button>
            </form>
            <p style="text-align: center; margin-top: 15px; color: #b0c4de;">Already have an account? <a href="#" id="show-login">Login here</a></p>
        </div>

        <!-- Login Section -->
        <div id="login-section" class="form-section hidden">
            <h2 style="text-align: center; margin-bottom: 20px; color: #00d2ff; text-shadow: 0 0 8px rgba(0, 210, 255, 0.4);">Login</h2>
            <form id="login-form">
                <input type="text" id="login-identifier" placeholder="Email or Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
            <p style="text-align: center; margin-top: 15px; color: #b0c4de;">Don't have an account? <a href="#" id="show-register">Register here</a></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
