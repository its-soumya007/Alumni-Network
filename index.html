<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVU Alumni Network - Login</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="container">
        
        <!-- Branding Header -->
        <div class="brand-header" style="text-align: center; margin-bottom: 25px;">
            <img src="image_d00988.jpg" alt="SVU Logo" style="height: 80px; width: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
            <h1 style="margin: 0; font-size: 1.6rem; color: #333;">SVU Alumni Network</h1>
        </div>

        <!-- Register Section -->
        <div id="register-section" class="form-section">
            <h2 style="text-align: center; margin-bottom: 20px;">Register</h2>
            <form id="register-form">
                <select id="reg-role" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="Student">Student</option>
                    <option value="Alumni">Alumni</option>
                </select>
                <input type="text" id="reg-name" placeholder="Full Name" required>
                <input type="email" id="reg-email" placeholder="Email Address" required>
                <input type="text" id="reg-username" placeholder="Unique Username" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <input type="password" id="reg-confirm-password" placeholder="Confirm Password" required>
                <button type="submit">Sign Up</button>
            </form>
            <p style="text-align: center; margin-top: 15px;">Already have an account? <a href="#" id="show-login">Login here</a></p>
        </div>

        <!-- Login Section -->
        <div id="login-section" class="form-section hidden">
            <h2 style="text-align: center; margin-bottom: 20px;">Login</h2>
            <form id="login-form">
                <!-- Changed to type="text" to accept both -->
                <input type="text" id="login-identifier" placeholder="Email or Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
            <p style="text-align: center; margin-top: 15px;">Don't have an account? <a href="#" id="show-register">Register here</a></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
