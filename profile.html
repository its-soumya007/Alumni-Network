<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile - Alumni Network</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-body">
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand" style="display: flex; align-items: center; gap: 12px;">
            <img src="image_d00988.jpg" alt="SVU Logo" style="height: 45px; width: 45px; border-radius: 50%; object-fit: cover;">
            <h1 style="margin: 0; font-size: 1.5rem;">SVU Alumni Network</h1>
        </div>
        <div class="nav-links">
            <a href="dashboard.html">Home</a>
            <a href="chat.html">Chat</a>
            <a href="about.html">About</a>
            <a href="profile.html" class="profile-icon active" title="Profile" id="nav-profile-btn" style="padding: 0; overflow: hidden;">
                <!-- New Image tag for the navbar avatar -->
                <img id="nav-avatar" src="" style="display: none; width: 100%; height: 100%; object-fit: cover;">
                <!-- Default SVG -->
                <svg id="nav-svg" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </a>
        </div>
    </nav>
    
    <main class="dashboard-container">
        <div class="profile-layout">
            <!-- Left Sidebar: Avatar & Basic Info -->
            <div class="profile-sidebar tile">
                <div class="avatar-container">
                    <img id="profile-avatar" src="https://via.placeholder.com/150" alt="Profile Picture">
                    <input type="file" id="avatar-upload" accept="image/*" class="hidden">
                    <label for="avatar-upload" class="upload-btn">Upload Picture</label>
                </div>
                <h3 id="display-name">Loading...</h3>
                <span id="display-role" class="badge">...</span>
            </div>

            <!-- Right Area: Details & Alumni Form -->
            <div class="profile-details tile">
                <h3>Account Information</h3>
                <div class="info-group">
                    <span class="info-label">Username:</span>
                    <span id="display-username" class="info-value">...</span>
                </div>
                <div class="info-group">
                    <span class="info-label">Email:</span>
                    <span id="display-email" class="info-value">...</span>
                </div>

                <!-- Editable Alumni Section -->
                <div id="alumni-section" class="hidden" style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1.5rem;">
                    <h3>Alumni Professional Details</h3>
                    <form id="alumni-form">
                        <div class="form-group">
                            <label for="company-input">Company Name</label>
                            <input type="text" id="company-input" placeholder="E.g. Google, TCS, Startup">
                        </div>
                        <div class="form-group">
                            <label for="designation-input">Designation</label>
                            <input type="text" id="designation-input" placeholder="E.g. Software Engineer">
                        </div>
                        <button type="submit" class="save-btn" style="margin-top: 10px;">Save Details</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Initialize Supabase
        const SUPABASE_URL = 'https://nklrpamkpcmrdyeqnjic.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_jbRlcZEhvMcvOnSGOWrzyw_emTnaE9w';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        // Helper function to update both avatars
        function updateAvatars(url) {
            // Update main profile picture
            document.getElementById('profile-avatar').src = url;
            
            // Update tiny navbar picture
            document.getElementById('nav-avatar').src = url;
            document.getElementById('nav-avatar').style.display = 'block';
            document.getElementById('nav-svg').style.display = 'none';
            document.getElementById('nav-profile-btn').style.backgroundColor = 'transparent'; // Removes blue background so image fits perfectly
        }

        async function loadProfile() {
            // 1. Get logged in user session
            const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
            
            if (authError || !user) {
                alert("Please log in to view your profile.");
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;

            // 2. Fetch profile data from database
            const { data: profile, error: dbError } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (profile) {
                // Populate UI
                document.getElementById('display-name').innerText = profile.full_name;
                document.getElementById('display-role').innerText = profile.role;
                document.getElementById('display-username').innerText = profile.username;
                document.getElementById('display-email').innerText = profile.email;
                
                // If user has an avatar, update the images
                if (profile.avatar_url) {
                    updateAvatars(profile.avatar_url);
                }

                // Show Alumni section if applicable
                if (profile.role === 'Alumni') {
                    document.getElementById('alumni-section').classList.remove('hidden');
                    document.getElementById('company-input').value = profile.company || '';
                    document.getElementById('designation-input').value = profile.designation || '';
                }
            }
        }

        // Handle Alumni Details Save
        document.getElementById('alumni-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const company = document.getElementById('company-input').value;
            const designation = document.getElementById('designation-input').value;

            const { error } = await supabaseClient
                .from('profiles')
                .update({ company: company, designation: designation })
                .eq('id', currentUser.id);

            if (error) {
                alert("Error saving details: " + error.message);
            } else {
                alert("Professional details updated successfully!");
            }
        });

        // Handle Profile Picture Upload
        document.getElementById('avatar-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const fileExt = file.name.split('.').pop();
            const fileName = `${currentUser.id}-${Math.random()}.${fileExt}`;

            // 1. Upload image to Supabase Storage bucket 'avatars'
            const { data, error } = await supabaseClient.storage
                .from('avatars')
                .upload(fileName, file);

            if (error) {
                alert("Upload failed: " + error.message);
                return;
            }

            // 2. Get the public URL of the uploaded image
            const { data: publicUrlData } = supabaseClient.storage
                .from('avatars')
                .getPublicUrl(fileName);
            
            const publicURL = publicUrlData.publicUrl;

            // 3. Save the URL to the user's profile table
            const { error: updateError } = await supabaseClient
                .from('profiles')
                .update({ avatar_url: publicURL })
                .eq('id', currentUser.id);

            if (!updateError) {
                // Instantly update both the main avatar and the navbar avatar
                updateAvatars(publicURL);
                alert("Profile picture updated!");
            }
        });

        // Run loadProfile when the page opens
        loadProfile();
    </script>
</body>
</html>
