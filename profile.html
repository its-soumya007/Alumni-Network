<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SVU Alumni Network</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-body">
    <!-- Top Navigation Bar -->
    <nav class="navbar" id="top-navbar">
        <div class="nav-brand" style="display: flex; align-items: center; gap: 12px;">
            <img src="image_d00988.jpg" alt="SVU Logo" style="height: 45px; width: 45px; border-radius: 50%; object-fit: cover;">
            <h1 style="margin: 0; font-size: 1.5rem;">SVU Alumni Network</h1>
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="chat.html">Chat</a>
            <a href="about.html">About</a>
            <a href="profile.html" class="active profile-icon" title="Profile" id="nav-profile-btn" style="padding: 0; overflow: hidden; background-color: transparent;">
                <img id="nav-avatar" src="" style="display: none; width: 100%; height: 100%; object-fit: cover;">
                <svg id="nav-svg" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </a>
        </div>
    </nav>

    <!-- Main Profile Content -->
    <main class="dashboard-container">
        <div class="dashboard-header">
            <h2>Your Profile</h2>
            <p>Manage your account details and session.</p>
        </div>

        <div class="profile-layout">
            <!-- Left Sidebar -->
            <div class="profile-sidebar tile" style="padding-bottom: 2rem;">
                <div class="avatar-container">
                    <img id="profile-avatar" src="https://via.placeholder.com/150" alt="Profile Picture">
                    <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
                    <button class="upload-btn" onclick="document.getElementById('avatar-upload').click()">Change Avatar</button>
                </div>
                <h3 id="profile-name-display" style="margin-top: 10px; color: #333;">Name</h3>
                <span id="profile-role-display" class="badge">Role</span>
                
                <!-- SECURE LOGOUT BUTTON -->
                <button id="logout-btn" class="btn-primary" style="margin-top: 40px; background-color: #dc3545; width: 100%; font-weight: bold;">
                    Logout
                </button>
            </div>

            <!-- Right Details Section -->
            <div class="profile-details tile">
                <form id="profile-form">
                    <div class="info-group">
                        <span class="info-label">Username:</span>
                        <span class="info-value" id="profile-username">@username</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Email:</span>
                        <span class="info-value" id="profile-email">email@example.com</span>
                    </div>

                    <div class="form-group" style="margin-top: 20px;">
                        <label>Full Name</label>
                        <input type="text" id="profile-fullname" required>
                    </div>

                    <!-- Alumni-only fields -->
                    <div id="alumni-fields" class="hidden">
                        <div class="form-group">
                            <label>Company</label>
                            <input type="text" id="profile-company" placeholder="e.g. Google">
                        </div>
                        <div class="form-group">
                            <label>Designation</label>
                            <input type="text" id="profile-designation" placeholder="e.g. Software Engineer">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary save-btn" style="margin-top: 15px;">Save Changes</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Initialize Supabase
        const SUPABASE_URL = 'https://nklrpamkpcmrdyeqnjic.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_jbRlcZEhvMcvOnSGOWrzyw_emTnaE9w';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentProfile = null;

        // Initialize User Session
        async function initProfile() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            
            // If not logged in, boot them out using replace()
            if (error || !user) {
                window.location.replace('login.html');
                return;
            }
            currentUser = user;

            // Fetch profile data
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
            if (profile) {
                currentProfile = profile;
                
                // Populate UI
                document.getElementById('profile-name-display').innerText = profile.full_name;
                document.getElementById('profile-role-display').innerText = profile.role;
                document.getElementById('profile-username').innerText = `@${profile.username}`;
                document.getElementById('profile-email').innerText = profile.email;
                document.getElementById('profile-fullname').value = profile.full_name;

                if (profile.avatar_url) {
                    document.getElementById('profile-avatar').src = profile.avatar_url;
                    
                    // Nav Avatar
                    document.getElementById('nav-avatar').src = profile.avatar_url;
                    document.getElementById('nav-avatar').style.display = 'block';
                    document.getElementById('nav-svg').style.display = 'none';
                }

                // Show extra fields if Alumni
                if (profile.role === 'Alumni') {
                    document.getElementById('alumni-fields').classList.remove('hidden');
                    document.getElementById('profile-company').value = profile.company || '';
                    document.getElementById('profile-designation').value = profile.designation || '';
                }
            }
        }

        // =====================================
        // SECURE LOGOUT LOGIC
        // =====================================
        document.getElementById('logout-btn').addEventListener('click', async () => {
            // 1. Destroy the session on the Supabase server
            await supabaseClient.auth.signOut();
            
            // 2. Clear any cached data in the browser
            localStorage.clear();
            sessionStorage.clear();
            
            // 3. Redirect using .replace() so the browser forgets this page existed
            window.location.replace('index.html');
        });

        // Save Profile Changes
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const updates = {
                full_name: document.getElementById('profile-fullname').value,
            };

            if (currentProfile.role === 'Alumni') {
                updates.company = document.getElementById('profile-company').value;
                updates.designation = document.getElementById('profile-designation').value;
            }

            const { error } = await supabaseClient.from('profiles').update(updates).eq('id', currentUser.id);

            if (error) {
                alert('Error updating profile: ' + error.message);
            } else {
                alert('Profile updated successfully!');
                initProfile(); // Refresh UI
            }
        });

        // Avatar Upload
        document.getElementById('avatar-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const fileExt = file.name.split('.').pop();
            const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;

            // Upload to storage
            const { error: uploadError } = await supabaseClient.storage
                .from('avatars')
                .upload(fileName, file, { upsert: true });

            if (uploadError) {
                alert('Error uploading avatar: ' + uploadError.message);
                return;
            }

            // Get URL and save to profile
            const { data: publicUrlData } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
            const avatarUrl = publicUrlData.publicUrl;

            await supabaseClient.from('profiles').update({ avatar_url: avatarUrl }).eq('id', currentUser.id);
            
            alert('Avatar updated!');
            initProfile();
        });

        initProfile();
    </script>
</body>
</html>
